<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Calendar/grid background -->
  <rect x="4" y="8" width="40" height="36" rx="4" fill="#2563eb"/>
  <!-- Top bar -->
  <rect x="4" y="8" width="40" height="10" rx="4" fill="#1e40af"/>
  <!-- Calendar hooks -->
  <rect x="14" y="4" width="3" height="8" rx="1.5" fill="#60a5fa"/>
  <rect x="31" y="4" width="3" height="8" rx="1.5" fill="#60a5fa"/>
  <!-- Grid lines -->
  <line x1="4" y1="26" x2="44" y2="26" stroke="#3b82f6" stroke-width="0.5"/>
  <line x1="4" y1="34" x2="44" y2="34" stroke="#3b82f6" stroke-width="0.5"/>
  <line x1="17.5" y1="18" x2="17.5" y2="44" stroke="#3b82f6" stroke-width="0.5"/>
  <line x1="30.5" y1="18" x2="30.5" y2="44" stroke="#3b82f6" stroke-width="0.5"/>
  <!-- Shift blocks -->
  <rect x="8" y="20" width="7" height="4" rx="1" fill="#60a5fa"/>
  <rect x="20" y="20" width="8" height="4" rx="1" fill="#34d399"/>
  <rect x="33" y="20" width="8" height="4" rx="1" fill="#fbbf24"/>
  <rect x="8" y="28" width="7" height="4" rx="1" fill="#fbbf24"/>
  <rect x="20" y="28" width="8" height="4" rx="1" fill="#60a5fa"/>
  <rect x="33" y="28" width="8" height="4" rx="1" fill="#34d399"/>
  <rect x="8" y="36" width="7" height="4" rx="1" fill="#34d399"/>
  <rect x="20" y="36" width="8" height="4" rx="1" fill="#fbbf24"/>
  <rect x="33" y="36" width="8" height="4" rx="1" fill="#60a5fa"/>
  <!-- Clock overlay -->
  <circle cx="38" cy="38" r="9" fill="white" stroke="#1e40af" stroke-width="2"/>
  <line x1="38" y1="38" x2="38" y2="33" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="38" x2="42" y2="38" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="38" cy="38" r="1" fill="#1e40af"/>
</svg>
